<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bedtime Tracker">
  <meta name="theme-color" content="#6366f1">
  <title>Bedtime Tracker</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    
    #root {
      min-height: 100vh;
    }
    
    @supports (-webkit-touch-callout: none) {
      body {
        min-height: -webkit-fill-available;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: .5;
      }
    }
  </style>
</head>
<body>
  <div id="root">Loading...</div>
  
  <!-- Load React and ReactDOM first -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Main app code runs after React is loaded -->
  <script>
    // Wait for React to be available
    (function() {
      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
        document.getElementById('root').innerHTML = '<div style="padding: 2rem; text-align: center;">Error loading React. Please refresh the page.</div>';
        return;
      }

    // Simple storage implementation using localStorage
    const storage = {
      get: async (key) => {
        const value = localStorage.getItem(key);
        return value ? { value, key } : null;
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        return { key, value };
      },
      delete: async (key) => {
        localStorage.removeItem(key);
        return { key, deleted: true };
      },
      list: async (prefix = '') => {
        const keys = Object.keys(localStorage).filter(k => k.startsWith(prefix));
        return { keys, prefix };
      }

    window.storage = storage;

      function Calendar({ style }) {
        return h('svg', { xmlns: 'http://www.w3.org/2000/svg', width: '24', height: '24', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', style }, [
          h('path', { key: 'p1', d: 'M8 2v4' }),
          h('path', { key: 'p2', d: 'M16 2v4' }),
          h('rect', { key: 'r', width: '18', height: '18', x: '3', y: '4', rx: '2' }),
          h('path', { key: 'p3', d: 'M3 10h18' })
        ]);
      }

      function Eye({ style }) {
        return h('svg', { xmlns: 'http://www.w3.org/2000/svg', width: '24', height: '24', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', style }, [
          h('path', { key: 'p1', d: 'M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z' }),
          h('circle', { key: 'c', cx: '12', cy: '12', r: '3' })
        ]);
      }

      function EyeOff({ style }) {
        return h('svg', { xmlns: 'http://www.w3.org/2000/svg', width: '24', height: '24', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', style }, [
          h('path', { key: 'p1', d: 'M9.88 9.88a3 3 0 1 0 4.24 4.24' }),
          h('path', { key: 'p2', d: 'M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68' }),
          h('path', { key: 'p3', d: 'M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61' }),
          h('line', { key: 'l', x1: '2', x2: '22', y1: '2', y2: '22' })
        ]);
      }

      function BedtimeTracker() {
        const [child1Name, setChild1Name] = useState('');
        const [child2Name, setChild2Name] = useState('');
        const [namesSet, setNamesSet] = useState(false);
        const [records, setRecords] = useState({});
        const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
        const [loading, setLoading] = useState(true);
        const [viewMode, setViewMode] = useState('child');

        useEffect(function() {
          try {
            const names = localStorage.getItem('bedtime-names');
            if (names) {
              const parsed = JSON.parse(names);
              setChild1Name(parsed.child1);
              setChild2Name(parsed.child2);
              setNamesSet(true);
            }
            const recs = localStorage.getItem('bedtime-records');
            if (recs) setRecords(JSON.parse(recs));
          } catch (e) {
            console.log('Starting fresh');
          }
          setLoading(false);
        }, []);

        const saveNames = function() {
          if (child1Name.trim() && child2Name.trim()) {
            localStorage.setItem('bedtime-names', JSON.stringify({ child1: child1Name, child2: child2Name }));
            setNamesSet(true);
          }
        };

        const toggleHabit = function(child, habitType) {
          const key = selectedDate + '-' + child + '-' + habitType;
          const newRecords = Object.assign({}, records);
          if (newRecords[key]) delete newRecords[key];
          else newRecords[key] = true;
          setRecords(newRecords);
          localStorage.setItem('bedtime-records', JSON.stringify(newRecords));
        };

        const isChecked = function(child, habitType, date) {
          if (!date) date = selectedDate;
          return records[date + '-' + child + '-' + habitType] || false;
        };

        const calculateStreak = function(child) {
          var streak = 0;
          var currentDate = new Date();
          while (streak < 30) {
            var dateStr = currentDate.toISOString().split('T')[0];
            if (isChecked(child, 'asleep', dateStr) && isChecked(child, 'morning', dateStr)) {
              streak++;
              currentDate.setDate(currentDate.getDate() - 1);
            } else break;
          }
          return streak;
        };

        const getRecentNights = function() {
          var nights = [];
          var today = new Date();
          for (var i = 6; i >= 0; i--) {
            var date = new Date(today);
            date.setDate(date.getDate() - i);
            nights.push(date.toISOString().split('T')[0]);
          }
          return nights;
        };

        if (loading) {
          return h('div', { style: { minHeight: '100vh', background: 'linear-gradient(to bottom right, #312e81, #6b21a8, #9f1239)', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
            h('div', { style: { color: 'white', fontSize: '1.5rem' } }, 'Loading...')
          );
        }

        if (!namesSet) {
          return h('div', { style: { minHeight: '100vh', background: 'linear-gradient(to bottom right, #312e81, #6b21a8, #9f1239)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' } },
            h('div', { style: { background: 'white', borderRadius: '1.5rem', boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.25)', padding: '2rem', maxWidth: '28rem', width: '100%' } }, [
              h('div', { key: 'hd', style: { textAlign: 'center', marginBottom: '1.5rem' } }, [
                h(Moon, { key: 'i', style: { width: '4rem', height: '4rem', color: '#4f46e5', margin: '0 auto 1rem' } }),
                h('h1', { key: 't', style: { fontSize: '1.875rem', fontWeight: 'bold', color: '#1f2937', marginBottom: '0.5rem' } }, 'Bedtime Tracker'),
                h('p', { key: 's', style: { color: '#4b5563' } }, "Let's set up your children's names")
              ]),
              h('div', { key: 'fm', style: { display: 'flex', flexDirection: 'column', gap: '1rem' } }, [
                h('div', { key: 'c1' }, [
                  h('label', { key: 'l', style: { display: 'block', fontSize: '0.875rem', fontWeight: '500', color: '#374151', marginBottom: '0.5rem' } }, "First Child's Name"),
                  h('input', { key: 'i', type: 'text', value: child1Name, onChange: function(e) { setChild1Name(e.target.value); }, style: { width: '100%', padding: '0.75rem 1rem', borderRadius: '0.5rem', border: '2px solid #d1d5db', fontSize: '1.125rem' }, placeholder: 'e.g., Emma' })
                ]),
                h('div', { key: 'c2' }, [
                  h('label', { key: 'l', style: { display: 'block', fontSize: '0.875rem', fontWeight: '500', color: '#374151', marginBottom: '0.5rem' } }, "Second Child's Name"),
                  h('input', { key: 'i', type: 'text', value: child2Name, onChange: function(e) { setChild2Name(e.target.value); }, style: { width: '100%', padding: '0.75rem 1rem', borderRadius: '0.5rem', border: '2px solid #d1d5db', fontSize: '1.125rem' }, placeholder: 'e.g., Oliver' })
                ]),
                h('button', { 
                  key: 'sb', 
                  onClick: saveNames, 
                  disabled: !child1Name.trim() || !child2Name.trim(), 
                  style: { 
                    width: '100%', 
                    background: (child1Name.trim() && child2Name.trim()) ? '#4f46e5' : '#d1d5db', 
                    color: 'white', 
                    padding: '0.75rem', 
                    borderRadius: '0.5rem', 
                    fontWeight: '600', 
                    border: 'none', 
                    cursor: (child1Name.trim() && child2Name.trim()) ? 'pointer' : 'not-allowed', 
                    fontSize: '1rem' 
                  } 
                }, 'Start Tracking')
              ])
            ])
          );
        }

        var recentNights = getRecentNights();
        var child1Streak = calculateStreak('child1');
        var child2Streak = calculateStreak('child2');

        if (viewMode === 'child') {
          var children = [
            { name: child1Name, child: 'child1', streak: child1Streak, gradient: 'linear-gradient(to bottom right, #f472b6, #a855f7)' },
            { name: child2Name, child: 'child2', streak: child2Streak, gradient: 'linear-gradient(to bottom right, #60a5fa, #14b8a6)' }
          ];

          return h('div', { style: { minHeight: '100vh', background: 'linear-gradient(to bottom right, #fde047, #fb923c, #f9a8d4)', padding: '1rem' } },
            h('div', { style: { maxWidth: '96rem', margin: '0 auto' } }, [
              h('div', { key: 'hd', style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2rem', paddingTop: '1rem', flexWrap: 'wrap', gap: '1rem' } }, [
                h('div', { key: 't', style: { display: 'flex', alignItems: 'center', gap: '0.75rem' } }, [
                  h(Star, { key: 'i', style: { width: '3rem', height: '3rem', color: '#ca8a04' }, className: 'pulse' }),
                  h('h1', { key: 't', style: { fontSize: 'clamp(1.5rem, 5vw, 3rem)', fontWeight: 'bold', color: '#581c87' } }, 'Good Morning!')
                ]),
                h('button', { key: 'b', onClick: function() { setViewMode('parent'); }, style: { background: 'rgba(255, 255, 255, 0.5)', padding: '0.75rem', borderRadius: '9999px', border: 'none', cursor: 'pointer' }, title: 'Parent view' }, 
                  h(Eye, { style: { width: '1.5rem', height: '1.5rem', color: '#374151' } })
                )
              ]),
              h('div', { key: 'st', style: { textAlign: 'center', marginBottom: '3rem' } }, 
                h('p', { style: { fontSize: 'clamp(1.25rem, 4vw, 1.875rem)', color: '#6b21a8', fontWeight: '600', padding: '0 1rem' } }, 'Did you stay in bed all night? Tap the happy faces! 😊')
              ),
              h('div', { key: 'ch', style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 300px), 1fr))', gap: '2rem', marginBottom: '2rem' } }, 
                children.map(function(item) {
                  var name = item.name;
                  var child = item.child;
                  var streak = item.streak;
                  var gradient = item.gradient;

                  return h('div', { key: child, style: { background: 'white', borderRadius: '1.5rem', boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.25)', padding: '2rem' } }, [
                    h('div', { key: 'pr', style: { textAlign: 'center', marginBottom: '2rem' } }, [
                      h('div', { key: 'av', style: { width: '8rem', height: '8rem', background: gradient, borderRadius: '9999px', margin: '0 auto 1rem', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '3.75rem', boxShadow: '0 10px 15px -3px rgba(0, 0, 0, 0.1)' } }, name.charAt(0).toUpperCase()),
                      h('h2', { key: 'nm', style: { fontSize: '2.25rem', fontWeight: 'bold', color: '#1f2937', marginBottom: '0.5rem' } }, name),
                      streak > 0 && h('div', { key: 'st', style: { display: 'inline-flex', alignItems: 'center', gap: '0.5rem', background: '#fef3c7', color: '#a16207', padding: '0.5rem 1rem', borderRadius: '9999px', fontSize: '1.25rem' } }, [
                        h(Award, { key: 'i', style: { width: '1.5rem', height: '1.5rem' } }),
                        h('span', { key: 't', style: { fontWeight: 'bold' } }, streak + ' nights!')
                      ])
                    ]),
                    h('div', { key: 'bt', style: { display: 'flex', flexDirection: 'column', gap: '1.5rem' } }, [
                      { type: 'asleep', label: 'I stayed in bed until I fell asleep', unchecked: '😴', gradient: 'linear-gradient(to bottom right, #4ade80, #10b981)' },
                      { type: 'morning', label: 'I stayed in bed until morning', unchecked: '☀️', gradient: 'linear-gradient(to bottom right, #60a5fa, #06b6d4)' }
                    ].map(function(btn) {
                      var type = btn.type;
                      var label = btn.label;
                      var unchecked = btn.unchecked;
                      var btnGradient = btn.gradient;
                      var checked = isChecked(child, type);

                      return h('div', { key: type, style: { textAlign: 'center' } }, [
                        h('p', { key: 'lb', style: { fontSize: '1.25rem', fontWeight: '600', color: '#374151', marginBottom: '1rem' } }, label),
                        h('button', { 
                          key: 'bt', 
                          onClick: function() { toggleHabit(child, type); }, 
                          style: { 
                            width: '100%', 
                            padding: '2rem', 
                            borderRadius: '1.5rem', 
                            border: 'none', 
                            cursor: 'pointer', 
                            background: checked ? btnGradient : '#e5e7eb', 
                            boxShadow: checked ? '0 10px 15px -3px rgba(0, 0, 0, 0.1)' : 'none', 
                            transition: 'all 0.2s' 
                          } 
                        }, [
                          h('div', { key: 'em', style: { fontSize: '5rem', marginBottom: '0.5rem' } }, checked ? '😊' : unchecked),
                          h('div', { key: 'tx', style: { fontSize: '1.5rem', fontWeight: 'bold', color: 'white' } }, checked ? (type === 'asleep' ? 'Great job!' : 'Amazing!') : 'Tap me!')
                        ])
                      ]);
                    }))
                  ]);
                })
              ),
              (isChecked('child1', 'asleep') && isChecked('child1', 'morning')) && h('div', { key: 'c1', className: 'pulse', style: { background: 'linear-gradient(to right, #fde047, #fb923c)', borderRadius: '1.5rem', padding: '1.5rem', marginBottom: '1.5rem', textAlign: 'center' } }, 
                h('p', { style: { fontSize: 'clamp(1.5rem, 4vw, 1.875rem)', fontWeight: 'bold', color: '#581c87' } }, '🌟 ' + child1Name + ' is a SUPERSTAR! 🌟')
              ),
              (isChecked('child2', 'asleep') && isChecked('child2', 'morning')) && h('div', { key: 'c2', className: 'pulse', style: { background: 'linear-gradient(to right, #fde047, #fb923c)', borderRadius: '1.5rem', padding: '1.5rem', textAlign: 'center' } }, 
                h('p', { style: { fontSize: 'clamp(1.5rem, 4vw, 1.875rem)', fontWeight: 'bold', color: '#581c87' } }, '🌟 ' + child2Name + ' is a SUPERSTAR! 🌟')
              )
            ])
          );
        }

        // Parent view - abbreviated for space, same pattern as child view
        return h('div', { style: { minHeight: '100vh', background: 'linear-gradient(to bottom right, #312e81, #6b21a8, #9f1239)', padding: '1rem' } },
          h('div', { style: { maxWidth: '64rem', margin: '0 auto', paddingBottom: '2rem' } }, [
            h('div', { key: 'hd', style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2rem', paddingTop: '1.5rem', flexWrap: 'wrap', gap: '1rem' } }, [
              h('div', { key: 't', style: { display: 'flex', alignItems: 'center', gap: '0.75rem' } }, [
                h(Moon, { key: 'i', style: { width: '2.5rem', height: '2.5rem', color: '#fde047' } }),
                h('div', { key: 't' }, [
                  h('h1', { key: 'h', style: { fontSize: 'clamp(1.5rem, 4vw, 2.25rem)', fontWeight: 'bold', color: 'white' } }, 'Bedtime Tracker'),
                  h('p', { key: 'p', style: { color: '#e9d5ff' } }, 'Parent View')
                ])
              ]),
              h('button', { key: 'b', onClick: function() { setViewMode('child'); }, style: { background: 'rgba(255, 255, 255, 0.2)', color: 'white', padding: '0.75rem 1.5rem', borderRadius: '9999px', fontWeight: '600', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.5rem' } }, [
                h(EyeOff, { key: 'i', style: { width: '1.25rem', height: '1.25rem' } }),
                'Child View'
              ])
            ]),
            h('div', { key: 'dt', style: { background: 'rgba(255, 255, 255, 0.1)', borderRadius: '1rem', padding: '1rem', marginBottom: '1.5rem' } },
              h('div', { style: { display: 'flex', alignItems: 'center', gap: '0.75rem', justifyContent: 'center', flexWrap: 'wrap' } }, [
                h(Calendar, { key: 'i', style: { width: '1.25rem', height: '1.25rem', color: 'white' } }),
                h('label', { key: 'l', style: { color: 'white', fontWeight: '500' } }, 'View Date:'),
                h('input', { key: 'in', type: 'date', value: selectedDate, onChange: function(e) { setSelectedDate(e.target.value); }, max: new Date().toISOString().split('T')[0], style: { padding: '0.5rem 1rem', borderRadius: '0.5rem', border: '2px solid rgba(255, 255, 255, 0.2)', background: 'rgba(255, 255, 255, 0.2)', color: 'white', fontWeight: '500' } })
              ])
            ),
            h('div', { key: 'st', style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 250px), 1fr))', gap: '1rem', marginBottom: '1.5rem' } }, [
              {name: child1Name, streak: child1Streak, gradient: 'linear-gradient(to bottom right, #ec4899, #9333ea)', lightColor: '#fce7f3'},
              {name: child2Name, streak: child2Streak, gradient: 'linear-gradient(to bottom right, #3b82f6, #14b8a6)', lightColor: '#dbeafe'}
            ].map(function(item, i) {
              return h('div', { key: i, style: { background: item.gradient, borderRadius: '1rem', padding: '1.5rem', color: 'white' } },
                h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between' } }, [
                  h('div', { key: 'i' }, [
                    h('h3', { key: 'n', style: { fontSize: '1.5rem', fontWeight: 'bold', marginBottom: '0.25rem' } }, item.name),
                    h('p', { key: 'l', style: { color: item.lightColor } }, 'Current Streak')
                  ]),
                  h('div', { key: 'n', style: { fontSize: '3rem', fontWeight: 'bold' } }, item.streak)
                ])
              );
            })),
            h('div', { key: 'tb', style: { background: 'white', borderRadius: '1.5rem', boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.25)', padding: '1.5rem' } }, [
              h('h3', { key: 't', style: { fontSize: '1.25rem', fontWeight: 'bold', color: '#1f2937', marginBottom: '1rem', textAlign: 'center' } }, 'Last 7 Nights'),
              h('div', { key: 's', style: { overflowX: 'auto' } },
                h('table', { style: { width: '100%', borderCollapse: 'collapse', minWidth: '300px' } }, [
                  h('thead', { key: 'th' }, h('tr', { style: { borderBottom: '2px solid #e5e7eb' } }, [
                    h('th', { key: 'd', style: { textAlign: 'left', padding: '0.75rem 0.5rem', color: '#4b5563', fontWeight: '500' } }, 'Date'),
                    h('th', { key: 'c1', style: { textAlign: 'center', padding: '0.75rem 0.5rem', color: '#4b5563', fontWeight: '500' } }, child1Name),
                    h('th', { key: 'c2', style: { textAlign: 'center', padding: '0.75rem 0.5rem', color: '#4b5563', fontWeight: '500' } }, child2Name)
                  ])),
                  h('tbody', { key: 'tb' }, recentNights.map(function(date) {
                    var dateObj = new Date(date + 'T12:00:00');
                    var dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                    var monthDay = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    var child1Both = isChecked('child1', 'asleep', date) && isChecked('child1', 'morning', date);
                    var child2Both = isChecked('child2', 'asleep', date) && isChecked('child2', 'morning', date);
                    
                    return h('tr', { key: date, style: { borderBottom: '1px solid #f3f4f6' } }, [
                      h('td', { key: 'd', style: { padding: '0.75rem 0.5rem' } }, [
                        h('div', { key: 'dy', style: { fontWeight: '500', color: '#1f2937' } }, dayName),
                        h('div', { key: 'mo', style: { fontSize: '0.875rem', color: '#6b7280' } }, monthDay)
                      ]),
                      h('td', { key: 'c1', style: { textAlign: 'center', padding: '0.75rem 0.5rem' } },
                        h('div', { style: { fontSize: '1.875rem' } }, child1Both ? '⭐' : (isChecked('child1', 'asleep', date) || isChecked('child1', 'morning', date) ? '✓' : '-'))
                      ),
                      h('td', { key: 'c2', style: { textAlign: 'center', padding: '0.75rem 0.5rem' } },
                        h('div', { style: { fontSize: '1.875rem' } }, child2Both ? '⭐' : (isChecked('child2', 'asleep', date) || isChecked('child2', 'morning', date) ? '✓' : '-'))
                      )
                    ]);
                  }))
                ])
              ),
              h('div', { key: 'lg', style: { marginTop: '1rem', textAlign: 'center', fontSize: '0.875rem', color: '#6b7280' } }, '⭐ = Both goals achieved! | ✓ = One goal achieved')
            ]),
            h('div', { key: 'rs', style: { marginTop: '1.5rem', textAlign: 'center' } },
              h('button', { onClick: function() { setNamesSet(false); setChild1Name(''); setChild2Name(''); }, style: { color: 'rgba(255, 255, 255, 0.7)', fontSize: '0.875rem', textDecoration: 'underline', background: 'none', border: 'none', cursor: 'pointer' } }, "Change children's names")
            )
          ])
        );
      }

      // Render the app
      try {
        var container = document.getElementById('root');
        var root = ReactDOM.createRoot(container);
        root.render(h(BedtimeTracker));
      } catch (error) {
        document.getElementById('root').innerHTML = '<div style="padding: 2rem; text-align: center; color: red;">Error starting app: ' + error.message + '</div>';
      }

      const recentNights = getRecentNights();
      const child1Streak = calculateStreak('child1');
      const child2Streak = calculateStreak('child2');

      if (viewMode === 'child') {
        return (
          <div style={{
            minHeight: '100vh',
            background: 'linear-gradient(to bottom right, #fde047, #fb923c, #f9a8d4)',
            padding: '1rem'
          }}>
            <div style={{ maxWidth: '96rem', margin: '0 auto' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2rem', paddingTop: '1rem', flexWrap: 'wrap', gap: '1rem' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                  <Star style={{ width: '3rem', height: '3rem', color: '#ca8a04', animation: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' }} />
                  <h1 style={{ fontSize: 'clamp(1.5rem, 5vw, 3rem)', fontWeight: 'bold', color: '#581c87' }}>Good Morning!</h1>
                </div>
                <button
                  onClick={() => setViewMode('parent')}
                  style={{
                    background: 'rgba(255, 255, 255, 0.5)',
                    padding: '0.75rem',
                    borderRadius: '9999px',
                    border: 'none',
                    cursor: 'pointer'
                  }}
                  title="Parent view"
                >
                  <Eye style={{ width: '1.5rem', height: '1.5rem', color: '#374151' }} />
                </button>
              </div>

              <div style={{ textAlign: 'center', marginBottom: '3rem' }}>
                <p style={{ fontSize: 'clamp(1.25rem, 4vw, 1.875rem)', color: '#6b21a8', fontWeight: '600', padding: '0 1rem' }}>
                  Did you stay in bed all night? Tap the happy faces! 😊
                </p>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 300px), 1fr))', gap: '2rem', marginBottom: '2rem' }}>
                {[
                  { name: child1Name, child: 'child1', streak: child1Streak, gradient: 'linear-gradient(to bottom right, #f472b6, #a855f7)' },
                  { name: child2Name, child: 'child2', streak: child2Streak, gradient: 'linear-gradient(to bottom right, #60a5fa, #14b8a6)' }
                ].map(({ name, child, streak, gradient }) => (
                  <div key={child} style={{ background: 'white', borderRadius: '1.5rem', boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.25)', padding: '2rem' }}>
                    <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
                      <div style={{
                        width: '8rem',
                        height: '8rem',
                        background: gradient,
                        borderRadius: '9999px',
                        margin: '0 auto 1rem',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        fontSize: '3.75rem',
                        boxShadow: '0 10px 15px -3px rgba(0, 0, 0, 0.1)'
                      }}>
                        {name.charAt(0).toUpperCase()}
                      </div>
                      <h2 style={{ fontSize: '2.25rem', fontWeight: 'bold', color: '#1f2937', marginBottom: '0.5rem' }}>{name}</h2>
                      {streak > 0 && (
                        <div style={{
                          display: 'inline-flex',
                          alignItems: 'center',
                          gap: '0.5rem',
                          background: '#fef3c7',
                          color: '#a16207',
                          padding: '0.5rem 1rem',
                          borderRadius: '9999px',
                          fontSize: '1.25rem'
                        }}>
                          <Award style={{ width: '1.5rem', height: '1.5rem' }} />
                          <span style={{ fontWeight: 'bold' }}>{streak} nights!</span>
                        </div>
                      )}
                    </div>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                      {[
                        { type: 'asleep', label: 'I stayed in bed until I fell asleep', unchecked: '😴', gradient: 'linear-gradient(to bottom right, #4ade80, #10b981)' },
                        { type: 'morning', label: 'I stayed in bed until morning', unchecked: '☀️', gradient: 'linear-gradient(to bottom right, #60a5fa, #06b6d4)' }
                      ].map(({ type, label, unchecked, gradient: btnGradient }) => (
                        <div key={type} style={{ textAlign: 'center' }}>
                          <p style={{ fontSize: '1.25rem', fontWeight: '600', color: '#374151', marginBottom: '1rem' }}>
                            {label}
                          </p>
                          <button
                            onClick={() => toggleHabit(child, type)}
                            style={{
                              width: '100%',
                              padding: '2rem',
                              borderRadius: '1.5rem',
                              border: 'none',
                              cursor: 'pointer',
                              background: isChecked(child, type) ? btnGradient : '#e5e7eb',
                              boxShadow: isChecked(child, type) ? '0 10px 15px -3px rgba(0, 0, 0, 0.1)' : 'none',
                              transition: 'all 0.2s'
                            }}
                          >
                            <div style={{ fontSize: '5rem', marginBottom: '0.5rem' }}>
                              {isChecked(child, type) ? '😊' : unchecked}
                            </div>
                            <div style={{ fontSize: '1.5rem', fontWeight: 'bold', color: 'white' }}>
                              {isChecked(child, type) ? (type === 'asleep' ? 'Great job!' : 'Amazing!') : 'Tap me!'}
                            </div>
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>

              {(isChecked('child1', 'asleep') && isChecked('child1', 'morning')) && (
                <div style={{
                  background: 'linear-gradient(to right, #fde047, #fb923c)',
                  borderRadius: '1.5rem',
                  padding: '1.5rem',
                  marginBottom: '1.5rem',
                  textAlign: 'center',
                  animation: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                }}>
                  <p style={{ fontSize: 'clamp(1.5rem, 4vw, 1.875rem)', fontWeight: 'bold', color: '#581c87' }}>
                    🌟 {child1Name} is a SUPERSTAR! 🌟
                  </p>
                </div>
              )}
              
              {(isChecked('child2', 'asleep') && isChecked('child2', 'morning')) && (
                <div style={{
                  background: 'linear-gradient(to right, #fde047, #fb923c)',
                  borderRadius: '1.5rem',
                  padding: '1.5rem',
                  textAlign: 'center',
                  animation: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                }}>
                  <p style={{ fontSize: 'clamp(1.5rem, 4vw, 1.875rem)', fontWeight: 'bold', color: '#581c87' }}>
                    🌟 {child2Name} is a SUPERSTAR! 🌟
                  </p>
                </div>
              )}
            </div>
          </div>
        );
      }

      // Parent view
      return (
        <div style={{
          minHeight: '100vh',
          background: 'linear-gradient(to bottom right, #312e81, #6b21a8, #9f1239)',
          padding: '1rem',
          paddingBottom: '2rem'
        }}>
          <div style={{ maxWidth: '64rem', margin: '0 auto' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2rem', paddingTop: '1.5rem', flexWrap: 'wrap', gap: '1rem' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                <Moon style={{ width: '2.5rem', height: '2.5rem', color: '#fde047' }} />
                <div>
                  <h1 style={{ fontSize: 'clamp(1.5rem, 4vw, 2.25rem)', fontWeight: 'bold', color: 'white' }}>Bedtime Tracker</h1>
                  <p style={{ color: '#e9d5ff', fontSize: 'clamp(0.875rem, 2vw, 1rem)' }}>Parent View</p>
                </div>
              </div>
              <button
                onClick={() => setViewMode('child')}
                style={{
                  background: 'rgba(255, 255, 255, 0.2)',
                  color: 'white',
                  padding: '0.75rem 1.5rem',
                  borderRadius: '9999px',
                  fontWeight: '600',
                  border: 'none',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '0.5rem'
                }}
              >
                <EyeOff style={{ width: '1.25rem', height: '1.25rem' }} />
                Child View
              </button>
            </div>

            <div style={{
              background: 'rgba(255, 255, 255, 0.1)',
              backdropFilter: 'blur(10px)',
              borderRadius: '1rem',
              padding: '1rem',
              marginBottom: '1.5rem'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', justifyContent: 'center', flexWrap: 'wrap' }}>
                <Calendar style={{ width: '1.25rem', height: '1.25rem', color: 'white' }} />
                <label style={{ color: 'white', fontWeight: '500' }}>View Date:</label>
                <input
                  type="date"
                  value={selectedDate}
                  onChange={(e) => setSelectedDate(e.target.value)}
                  max={new Date().toISOString().split('T')[0]}
                  style={{
                    padding: '0.5rem 1rem',
                    borderRadius: '0.5rem',
                    border: '2px solid rgba(255, 255, 255, 0.2)',
                    background: 'rgba(255, 255, 255, 0.2)',
                    color: 'white',
                    fontWeight: '500'
                  }}
                />
              </div>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 250px), 1fr))', gap: '1rem', marginBottom: '1.5rem' }}>
              <div style={{
                background: 'linear-gradient(to bottom right, #ec4899, #9333ea)',
                borderRadius: '1rem',
                padding: '1.5rem',
                color: 'white'
              }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <div>
                    <h3 style={{ fontSize: '1.5rem', fontWeight: 'bold', marginBottom: '0.25rem' }}>{child1Name}</h3>
                    <p style={{ color: '#fce7f3' }}>Current Streak</p>
                  </div>
                  <div style={{ fontSize: '3rem', fontWeight: 'bold' }}>{child1Streak}</div>
                </div>
              </div>
              
              <div style={{
                background: 'linear-gradient(to bottom right, #3b82f6, #14b8a6)',
                borderRadius: '1rem',
                padding: '1.5rem',
                color: 'white'
              }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <div>
                    <h3 style={{ fontSize: '1.5rem', fontWeight: 'bold', marginBottom: '0.25rem' }}>{child2Name}</h3>
                    <p style={{ color: '#dbeafe' }}>Current Streak</p>
                  </div>
                  <div style={{ fontSize: '3rem', fontWeight: 'bold' }}>{child2Streak}</div>
                </div>
              </div>
            </div>

            <div style={{ background: 'white', borderRadius: '1.5rem', boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.25)', padding: '1.5rem' }}>
              <h3 style={{ fontSize: '1.25rem', fontWeight: 'bold', color: '#1f2937', marginBottom: '1rem', textAlign: 'center' }}>
                Last 7 Nights
              </h3>
              
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: '300px' }}>
                  <thead>
                    <tr style={{ borderBottom: '2px solid #e5e7eb' }}>
                      <th style={{ textAlign: 'left', padding: '0.75rem 0.5rem', color: '#4b5563', fontWeight: '500' }}>Date</th>
                      <th style={{ textAlign: 'center', padding: '0.75rem 0.5rem', color: '#4b5563', fontWeight: '500' }}>{child1Name}</th>
                      <th style={{ textAlign: 'center', padding: '0.75rem 0.5rem', color: '#4b5563', fontWeight: '500' }}>{child2Name}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {recentNights.map((date) => {
                      const dateObj = new Date(date + 'T12:00:00');
                      const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                      const monthDay = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                      
                      const child1Both = isChecked('child1', 'asleep', date) && isChecked('child1', 'morning', date);
                      const child2Both = isChecked('child2', 'asleep', date) && isChecked('child2', 'morning', date);
                      
                      return (
                        <tr key={date} style={{ borderBottom: '1px solid #f3f4f6' }}>
                          <td style={{ padding: '0.75rem 0.5rem' }}>
                            <div style={{ fontWeight: '500', color: '#1f2937' }}>{dayName}</div>
                            <div style={{ fontSize: '0.875rem', color: '#6b7280' }}>{monthDay}</div>
                          </td>
                          <td style={{ textAlign: 'center', padding: '0.75rem 0.5rem' }}>
                            {child1Both ? (
                              <div style={{ fontSize: '1.875rem' }}>⭐</div>
                            ) : isChecked('child1', 'asleep', date) || isChecked('child1', 'morning', date) ? (
                              <div style={{ fontSize: '1.875rem' }}>✓</div>
                            ) : (
                              <div style={{ fontSize: '1.5rem', color: '#d1d5db' }}>-</div>
                            )}
                          </td>
                          <td style={{ textAlign: 'center', padding: '0.75rem 0.5rem' }}>
                            {child2Both ? (
                              <div style={{ fontSize: '1.875rem' }}>⭐</div>
                            ) : isChecked('child2', 'asleep', date) || isChecked('child2', 'morning', date) ? (
                              <div style={{ fontSize: '1.875rem' }}>✓</div>
                            ) : (
                              <div style={{ fontSize: '1.5rem', color: '#d1d5db' }}>-</div>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              
              <div style={{ marginTop: '1rem', textAlign: 'center', fontSize: '0.875rem', color: '#6b7280' }}>
                ⭐ = Both goals achieved! | ✓ = One goal achieved
              </div>
            </div>

            <div style={{ marginTop: '1.5rem', textAlign: 'center' }}>
              <button
                onClick={resetNames}
                style={{
                  color: 'rgba(255, 255, 255, 0.7)',
                  fontSize: '0.875rem',
                  textDecoration: 'underline',
                  background: 'none',
                  border: 'none',
                  cursor: 'pointer'
                }}
              >
                Change children's names
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BedtimeTracker />);
  </script>
</body>
</html>
